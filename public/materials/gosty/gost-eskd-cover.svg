<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">От технического чертежа к 3D-модели</title>
<desc id="desc">Схематичные виды детали с размерами и объёмная модель с отверстием на инженерной сетке.</desc>
<defs>
